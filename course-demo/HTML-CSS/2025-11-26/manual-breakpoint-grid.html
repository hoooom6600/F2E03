<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手刻格線系統</title>
    <!-- <link rel="stylesheet" href="../../reset.css" /> -->
    <link rel="stylesheet" href="../../column.css" />
    <link rel="stylesheet" href="manual-breakpoint-grid.css" />
  </head>
  <body>
    <section>
      <h2>col有s系列</h2>
      <div class="container">
        <div class="row cols-1 cols-md-5 cols-lg-7">
          <div class="col">
            <div class="card">card1</div>
          </div>
          <div class="col">
            <div class="card">card2</div>
          </div>
          <div class="col">
            <div class="card">card3</div>
          </div>
          <div class="col">
            <div class="card">card4</div>
          </div>
          <div class="col">
            <div class="card">card5</div>
          </div>
          <div class="col">
            <div class="card">card6</div>
          </div>
          <div class="col">
            <div class="card">card7</div>
          </div>
          <div class="col">
            <div class="card">card8</div>
          </div>
          <div class="col">
            <div class="card">card9</div>
          </div>
          <div class="col">
            <div class="card">card10</div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>正常的 margin，col沒有s系列。支援響應式:&rpar;</h2>
      <div class="container">
        <div class="row">
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card1</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card2</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card3</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card4</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card5</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card6</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card7</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card8</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card9</div>
          </div>
          <div class="col-12 col-md-3 col-lg-2">
            <div class="card">card10</div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>壞掉的 margin</h2>
      <div class="banner col-12">banner</div>
      <div class="card col-4">card1</div>
      <div class="card col-4">card2</div>
      <div class="card col-4">card3</div>
      <div class="card col-6">card4</div>
      <div class="card col-6">card5</div>
      <div class="card col-3">card6</div>
      <div class="card col-3">card7</div>
      <div class="card col-3">card8</div>
      <div class="card col-3">card9</div>
      <div class="card col-7">card10</div>
    </section>
  </body>
</html>
