<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <h2>寵物相簿</h2>

      <div class="gallery">
        <!-- 動態綁定 src 和 alt -->
        <img :src="currentPet.image" :alt="currentPet.name" class="pet-image" />

        <div class="controls">
          <button @click="prevPet">上一張</button>
          <span>{{ currentIndex + 1 }} / {{ pets.length }}</span>
          <button @click="nextPet">下一張</button>
        </div>

        <p class="pet-name">
          <!-- 顯示寵物名稱 -->
          {{ currentPet.name}}
        </p>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            currentIndex: 0,
            pets: [
              {
                name: "小橘",
                image:
                  "https://images.unsplash.com/photo-1573865526739-10659fec78a5?q=80&w=1015&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
              },
              {
                name: "阿花",
                image:
                  "https://images.unsplash.com/photo-1503777119540-ce54b422baff?q=80&w=986&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
              },
              {
                name: "黑皮",
                image:
                  "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=2043&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
              },
            ],
          };
        },
        computed: {
          currentPet() {
            return this.pets[this.currentIndex];
          },
        },
        methods: {
          prevPet() {
            // 完成切換到上一張的邏輯
            this.currentIndex =
              (this.currentIndex - 1 + this.pets.length) % this.pets.length;
          },
          nextPet() {
            // 完成切換到下一張的邏輯
            this.currentIndex = (this.currentIndex + 1) % this.pets.length;
          },
        },
      }).mount("#app");
    </script>

    <style>
      .gallery {
        text-align: center;
        max-width: 400px;
      }
      .pet-image {
        width: 300px;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
      }
      .controls {
        margin: 15px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      .pet-name {
        font-size: 1.2em;
        font-weight: bold;
      }
    </style>
  </body>
</html>
