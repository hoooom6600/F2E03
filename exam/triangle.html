<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>製作三角形</title>
    <style>
      .triangle {
        width: 0;
        height: 0;
        border-top: 80px solid transparent;
        border-right: 60px solid transparent;
        border-bottom: 80px solid #3498db;
        border-left: 60px solid #3498db;
      }
    </style>
  </head>
  <body>
    <!--
    請使用 HTML 和 CSS 製作一個直角三角形：
        
        需求：
        1. 直角三角形的直角位於左下角
        2. 短邊：60px
        3. 長邊：80px
        4. 斜邊：從左上角到右下角 100px
        5. 三角形顏色：#3498db
        6. 請自行撰寫 HTML 結構和完整的 CSS 代碼
        示意圖：
        |\
        | \
        |  \
        |   \
        |____\ 
    -->
    <div class="triangle"></div>
  </body>
</html>
