<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      .note-app {
        max-width: 500px;
        margin: 20px auto;
      }
      .note-input {
        width: 100%;
        height: 200px;
        padding: 15px;
        font-size: 16px;
        resize: vertical;
      }
      .status {
        margin-top: 10px;
        color: #666;
      }
      .saved {
        color: #42b983;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="note-app">
        <h2>我的筆記</h2>
        <textarea
          class="note-input"
          v-model="noteContent"
          placeholder="在這裡輸入筆記..."
        ></textarea>

        <p class="status" :class="{ saved: justSaved }">{{ statusText }}</p>

        <button @click="clearNote">清除筆記</button>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            noteContent: "",
            lastSaved: null,
            justSaved: false,
          };
        },
        computed: {
          statusText() {
            if (this.justSaved) return "已儲存！";
            if (this.lastSaved) return `上次儲存：${this.lastSaved}`;
            return "尚未儲存";
          },
        },
        methods: {
          saveToLocalStorage() {
            localStorage.setItem("myNote", this.noteContent);
            this.lastSaved = new Date().toLocaleTimeString();
            this.justSaved = true;
            setTimeout(() => {
              this.justSaved = false;
            }, 2000);
          },
          loadFromLocalStorage() {
            const saved = localStorage.getItem("myNote");
            if (saved) {
              this.noteContent = saved;
            }
          },
          clearNote() {
            this.noteContent = "";
            localStorage.removeItem("myNote");
          },
        },
        created() {
          this.loadFromLocalStorage();
        },
        // TODO: 加入 watch 監聽 noteContent
        // 當內容改變時，呼叫 saveToLocalStorage
        watch: {
          noteContent(newValue, oldValue) {
            this.saveToLocalStorage();
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
